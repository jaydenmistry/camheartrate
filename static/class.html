<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Heart Rates</title>
<script src="/static/theme.js"></script>
<style>
  /* Projector view: how many people are connected, and everyone's heart rate.
     Same Apple-style tokens as the measuring page. */
  :root {
    --ground: #f2f2f7; --card: #ffffff; --ink: #000000; --muted: #6c6c70; --rule: #e5e5ea;
    --fill: rgb(120 120 128 / 0.12); --fill-hover: rgb(120 120 128 / 0.2); --thumb: #ffffff;
    --tint: #ff2d55;        /* chart marks and hearts (3.6:1 on the card) */
    --blood: #d70015;       /* red text */
    --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px rgb(0 0 0 / 0.04);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
    --spring: cubic-bezier(0.22, 1.2, 0.36, 1);
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --ground: #000000; --card: #1c1c1e; --ink: #ffffff; --muted: #98989d; --rule: #38383a;
    --fill: rgb(118 118 128 / 0.24); --fill-hover: rgb(118 118 128 / 0.34); --thumb: #636366;
    --tint: #ff375f; --blood: #ff453a; --shadow: none;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body {
    font-family: var(--font); font-size: 17px; line-height: 1.4; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
    padding: clamp(16px, 2.6vw, 36px) max(16px, 3vw);
    transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
  }
  main { max-width: 1400px; margin: 0 auto; display: grid; gap: clamp(14px, 2vh, 22px); }

  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.985); } }
  main > * { animation: rise 0.7s var(--spring) both; }
  main > *:nth-child(2) { animation-delay: 0.06s; }
  main > *:nth-child(3) { animation-delay: 0.12s; }
  main > *:nth-child(n+4) { animation-delay: 0.18s; }

  .card { background: var(--card); border-radius: 22px; padding: clamp(16px, 2vw, 24px); box-shadow: var(--shadow); }

  header { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  h1 {
    margin: 0; font-size: clamp(30px, 4.2vw, 56px); font-weight: 700; line-height: 1.05; letter-spacing: -0.025em;
  }
  .join { display: flex; align-items: center; gap: 16px; }
  .qr { background: #fff; padding: 8px; border-radius: 14px; line-height: 0; box-shadow: var(--shadow); }
  .qr img, .qr canvas { width: clamp(96px, 10vw, 150px); height: auto; }
  .join-text { display: grid; }
  .join-label { color: var(--muted); font-size: 15px; }
  .join-url { font-size: clamp(18px, 2vw, 28px); font-weight: 600; overflow-wrap: anywhere; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .stat { display: grid; gap: 2px; }
  .stat b {
    font-family: var(--font-num); font-size: clamp(44px, 5.6vw, 84px); font-weight: 700; line-height: 1;
    letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  .stat span { color: var(--muted); font-size: 15px; font-weight: 500; }

  .charts { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
  .charts.single { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 860px) { .charts { grid-template-columns: minmax(0, 1fr); } }
  figure { margin: 0; display: grid; gap: 8px; min-width: 0; position: relative; align-content: start; }
  figure:not([hidden]) { animation: rise 0.6s var(--spring) both; }
  figcaption { color: var(--muted); font-size: 15px; }
  .chart-title { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  svg text { font-family: var(--font); fill: var(--muted); font-size: 13px; }
  .empty { fill: var(--muted); font-size: 16px; }
  @keyframes pop { from { transform: scale(0); } }
  .dot-mark { transform-box: fill-box; transform-origin: center; animation: pop 0.5s var(--spring) both; }
  .tip {
    position: absolute; pointer-events: none; background: var(--ink); color: var(--card);
    font-size: 14px; font-weight: 500; padding: 5px 10px; border-radius: 8px; white-space: nowrap;
    transform: translate(-50%, calc(-100% - 10px));
  }
  details { color: var(--muted); font-size: 14px; padding-inline: 4px; }
  summary { cursor: pointer; }
  table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 14px 2px 0; text-align: left; font-weight: 400; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding-inline: 4px; }
  .foot-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: 14px; }
  .status.bad { color: var(--blood); }
  .reset {
    font: inherit; font-size: 15px; font-weight: 500; color: var(--blood); background: var(--fill);
    border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer;
    transition: transform 0.35s var(--spring), background-color 0.2s;
  }
  .reset:hover { background: var(--fill-hover); }
  .reset:active { transform: scale(0.95); transition-duration: 0.08s; }
  .reset:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }

  /* Segmented control (Light / Dark). */
  .segmented { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 9px; padding: 2px; }
  .segmented button {
    position: relative; z-index: 1; font: inherit; font-size: 13px; font-weight: 500; color: var(--ink);
    background: none; border: 0; padding: 5px 16px; border-radius: 7px; cursor: pointer;
  }
  .segmented button:focus-visible { outline: 2px solid var(--tint); outline-offset: 1px; }
  .segmented .thumb {
    position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px);
    background: var(--thumb); border-radius: 7px; box-shadow: 0 3px 8px rgb(0 0 0 / 0.12), 0 3px 1px rgb(0 0 0 / 0.04);
    transition: transform 0.4s var(--spring), background-color 0.3s;
  }
  .segmented[data-value="dark"] .thumb { transform: translateX(100%); }

  /* Wall of hearts: one per connected camera, each beating at its measured rate. */
  .hearts-wrap { display: grid; gap: 10px; }
  .hearts {
    --size: 96px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--size), 1fr)); gap: 6px 4px;
    min-height: calc(var(--size) + 28px); align-content: start;
  }
  .heart { display: grid; justify-items: center; gap: 2px; transition: opacity 0.5s var(--ease), transform 0.5s var(--ease); }
  .heart:not(.gone) { animation: pop 0.6s var(--spring) both; }
  .heart.gone { opacity: 0; transform: scale(0.6); }
  .heart svg { width: calc(var(--size) * 0.82); height: auto; overflow: visible; will-change: transform; }
  .heart path { fill: var(--tint); stroke: var(--card); stroke-width: 1; transition: fill 0.6s var(--ease), opacity 0.6s; }
  .heart.waiting path { fill: var(--muted); opacity: 0.4; }
  .heart span {
    font-family: var(--font-num); font-size: calc(var(--size) * 0.2); font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1; color: var(--ink);
  }
  .heart.waiting span { color: var(--muted); font-weight: 500; }
  .hearts-empty { color: var(--muted); font-size: 16px; align-self: center; grid-column: 1 / -1; }

  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.35s; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Heart rates in this room</h1>
    <div class="join">
      <div class="qr" id="qr" aria-hidden="true"></div>
      <div class="join-text"><span class="join-label">Measure yours at</span><span class="join-url" id="url"></span></div>
    </div>
  </header>

  <section class="stats card" aria-label="Summary">
    <div class="stat"><b id="connected">0</b><span>connected</span></div>
    <div class="stat"><b id="reading">0</b><span>with a reading</span></div>
    <div class="stat"><b id="median">–</b><span>median bpm</span></div>
    <div class="stat"><b id="range">–</b><span>range, bpm</span></div>
  </section>

  <section class="hearts-wrap card" aria-label="Every heart in the room">
    <div class="chart-title">Every heart in the room</div>
    <div class="hearts" id="hearts"><div class="hearts-empty" id="heartsEmpty">A heart appears here for everyone who joins.</div></div>
    <figcaption>Each heart beats at the rate its own camera measures. Grey hearts are still measuring.</figcaption>
  </section>

  <section class="charts" id="charts">
    <figure class="card">
      <div class="chart-title">Everyone's heart rate</div>
      <svg id="hist" role="img" aria-label="Heart rates of everyone with a reading, one dot per person"></svg>
      <figcaption>One dot per person, grouped in 5 bpm steps. Readings update every second.</figcaption>
      <div class="tip" id="histTip" hidden></div>
    </figure>
    <figure class="card" id="checksFig" hidden>
      <div class="chart-title">Camera vs. finger on the pulse</div>
      <svg id="scatter" role="img" aria-label="Pulse checks: tapped rate against camera rate"></svg>
      <figcaption id="checksText"></figcaption>
      <div class="tip" id="scatterTip" hidden></div>
    </figure>
  </section>

  <details>
    <summary>Show as a table</summary>
    <table id="table"><thead><tr><th>bpm</th><th>people</th></tr></thead><tbody></tbody></table>
  </details>
  <div class="foot">
    <div class="status" id="status">Connecting…</div>
    <div class="foot-right">
      <button class="reset" id="resetBtn" hidden>Clear pulse checks</button>
      <div class="segmented" id="theme" data-theme-switch role="radiogroup" aria-label="Appearance">
        <span class="thumb" aria-hidden="true"></span>
        <button role="radio" data-choice="light">Light</button>
        <button role="radio" data-choice="dark">Dark</button>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const BIN = 5;
// Opened as /class?presenter=<RPPG_PRESENTER_KEY>: offer to clear the pulse checks (e.g. after a rehearsal).
const PRESENTER_KEY = new URLSearchParams(location.search).get('presenter') || '';
const joinUrl = location.origin + '/';
$('url').textContent = joinUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
function makeQr() {
  try {
    new QRCode($('qr'), { text: joinUrl, width: 300, height: 300, colorDark: '#000000', colorLight: '#ffffff',
                          correctLevel: QRCode.CorrectLevel.M });
  } catch (e) { $('qr').hidden = true; }    // no QR library: the address alone still works
}
// The QR library from this server (fetch_assets.py), else from cdnjs.
function loadQr(urls) {
  if (!urls.length) { $('qr').hidden = true; return; }
  const s = document.createElement('script');
  s.src = urls[0];
  s.onload = makeQr;
  s.onerror = () => loadQr(urls.slice(1));
  document.head.appendChild(s);
}
loadQr(['/static/vendor/qrcode.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js']);

function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function tip(id, figure, text, x, y) {
  const t = $(id);
  if (!text) { t.hidden = true; return; }
  const r = figure.getBoundingClientRect();
  t.textContent = text; t.hidden = false;
  t.style.left = `${x - r.left}px`; t.style.top = `${y - r.top}px`;
}

// ------------------------------------------------------------ dot histogram

let shownBins = {};               // dots per bin last time, so only new ones animate
function drawHistogram(readings, median) {
  const svg = $('hist');
  const W = Math.max(320, svg.clientWidth || 800), H = Math.round(Math.min(420, Math.max(220, W * 0.38)));
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.replaceChildren();
  const padL = 8, padR = 8, padT = 26, padB = 30;
  const lo = Math.min(50, Math.floor((Math.min(...readings, 999) - BIN) / BIN) * BIN);
  const hi = Math.max(130, Math.ceil((Math.max(...readings, 0) + BIN) / BIN) * BIN);
  const bins = (hi - lo) / BIN, plotW = W - padL - padR, plotH = H - padT - padB;
  const binW = plotW / bins, x = (v) => padL + (v - lo) / (hi - lo) * plotW, base = padT + plotH;
  const counts = new Array(bins).fill(0);
  for (const r of readings) counts[Math.min(bins - 1, Math.max(0, Math.floor((r - lo) / BIN)))]++;
  const rows = counts.map((n, i) => [lo + i * BIN, n]).filter(([, n]) => n);
  $('table').tBodies[0].replaceChildren(...rows.map(([from, n]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${from}–${from + BIN - 1}</td><td>${n}</td>`;
    return tr;
  }));
  const tallest = Math.max(1, ...counts);
  const rad = Math.max(4, Math.min(binW * 0.4, (plotH / tallest) / 2 - 1, 16));

  const surface = cssVar('--card'), mark = cssVar('--tint'), rule = cssVar('--rule'), ink = cssVar('--ink');
  el('line', { x1: padL, x2: W - padR, y1: base + 0.5, y2: base + 0.5, stroke: rule, 'stroke-width': 1 }, svg);
  for (let v = Math.ceil(lo / 10) * 10; v <= hi; v += 10) {
    el('line', { x1: x(v), x2: x(v), y1: base, y2: base + 5, stroke: rule, 'stroke-width': 1 }, svg);
    el('text', { x: x(v), y: base + 20, 'text-anchor': 'middle' }, svg).textContent = v;
  }
  if (!readings.length) {
    el('text', { x: W / 2, y: padT + plotH / 2, 'text-anchor': 'middle', class: 'empty' }, svg)
      .textContent = 'Dots appear here as people get a reading.';
    return;
  }
  if (median !== null) {
    el('line', { x1: x(median), x2: x(median), y1: padT - 6, y2: base, stroke: ink, 'stroke-width': 1 }, svg);
    el('text', { x: x(median), y: padT - 12, 'text-anchor': 'middle', style: `fill:${ink}` }, svg)
      .textContent = `median ${Math.round(median)}`;
  }
  const before = shownBins;
  shownBins = {};
  counts.forEach((n, i) => {
    const cx = padL + (i + 0.5) * binW, from = lo + i * BIN;
    shownBins[from] = n;
    for (let k = 0; k < n; k++) {
      // Only a dot that was not there a second ago pops in.
      el('circle', { cx, cy: base - rad - 1 - k * (2 * rad + 2), r: rad, fill: mark, stroke: surface, 'stroke-width': 2,
                     class: k >= (before[from] || 0) ? 'dot-mark' : '' }, svg);
    }
    // Hover target: the whole column, bigger than the dots.
    const hit = el('rect', { x: padL + i * binW, y: padT, width: binW, height: plotH, fill: 'transparent' }, svg);
    hit.addEventListener('pointermove', (e) => tip('histTip', svg.parentNode,
      `${from}–${from + BIN - 1} bpm · ${n} ${n === 1 ? 'person' : 'people'}`, e.clientX, e.clientY));
    hit.addEventListener('pointerleave', () => tip('histTip', svg.parentNode, ''));
  });
}

// ------------------------------------------------------------ pulse checks

function drawChecks(checks) {
  $('checksFig').hidden = !checks.length;
  $('charts').classList.toggle('single', !checks.length);
  if (!checks.length) return;
  const diffs = checks.map(([tapped, camera]) => Math.abs(tapped - camera)).sort((a, b) => a - b);
  const close = diffs.filter(d => d <= 5).length;
  const mid = diffs[Math.floor(diffs.length / 2)];
  $('checksText').textContent = `${checks.length} pulse check${checks.length === 1 ? '' : 's'}. `
    + `Camera within 5 bpm of the finger for ${close} of ${checks.length}; typical gap ${Math.round(mid)} bpm. `
    + 'Dots on the diagonal agree exactly.';

  const svg = $('scatter');
  const S = Math.max(240, svg.clientWidth || 360);
  svg.setAttribute('viewBox', `0 0 ${S} ${S}`);
  svg.replaceChildren();
  const pad = 34, plot = S - pad - 10;
  const all = checks.flat();
  const lo = Math.min(50, Math.floor((Math.min(...all) - 5) / 10) * 10);
  const hi = Math.max(120, Math.ceil((Math.max(...all) + 5) / 10) * 10);
  const sx = (v) => pad + (v - lo) / (hi - lo) * plot, sy = (v) => 10 + plot - (v - lo) / (hi - lo) * plot;
  const surface = cssVar('--card'), mark = cssVar('--tint'), rule = cssVar('--rule'), muted = cssVar('--muted');

  // ±5 bpm agreement band, then the diagonal.
  el('polygon', { points: [[lo, lo + 5], [hi - 5, hi], [hi, hi], [hi, hi - 5], [lo + 5, lo], [lo, lo]]
    .map(([a, b]) => `${sx(a)},${sy(b)}`).join(' '), fill: muted, 'fill-opacity': 0.1 }, svg);
  el('line', { x1: sx(lo), y1: sy(lo), x2: sx(hi), y2: sy(hi), stroke: rule, 'stroke-width': 1 }, svg);
  el('line', { x1: pad, x2: pad + plot, y1: 10 + plot + 0.5, y2: 10 + plot + 0.5, stroke: rule }, svg);
  el('line', { x1: pad - 0.5, x2: pad - 0.5, y1: 10, y2: 10 + plot, stroke: rule }, svg);
  for (let v = lo; v <= hi; v += 20) {
    el('text', { x: sx(v), y: 10 + plot + 18, 'text-anchor': 'middle' }, svg).textContent = v;
    el('text', { x: pad - 6, y: sy(v) + 4, 'text-anchor': 'end' }, svg).textContent = v;
  }
  el('text', { x: pad + plot, y: 10 + plot - 6, 'text-anchor': 'end' }, svg).textContent = 'finger →';
  el('text', { x: pad + 6, y: 22 }, svg).textContent = '↑ camera';
  for (const [tapped, camera] of checks) {
    const dot = el('circle', { cx: sx(tapped), cy: sy(camera), r: 6, fill: mark, stroke: surface, 'stroke-width': 2 }, svg);
    const hit = el('circle', { cx: sx(tapped), cy: sy(camera), r: 14, fill: 'transparent' }, svg);
    hit.addEventListener('pointermove', (e) => tip('scatterTip', svg.parentNode,
      `finger ${Math.round(tapped)} · camera ${Math.round(camera)} bpm`, e.clientX, e.clientY));
    hit.addEventListener('pointerleave', () => tip('scatterTip', svg.parentNode, ''));
  }
}

// ------------------------------------------------------------ wall of hearts
// One heart per connected camera, in the order people joined, beating at the
// rate that camera measures. Phases start at random, so the room is out of step,
// as real hearts are. Nothing but the rate is shown.

const HEART = 'M12 21C12 21 3 14.6 3 8.6A4.6 4.6 0 0 1 12 6.4A4.6 4.6 0 0 1 21 8.6C21 14.6 12 21 12 21Z';
const hearts = new Map();          // id -> { el, label, svg, bpm, phase }
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function drawHearts(list) {
  const box = $('hearts'), seen = new Set();
  for (const [id, bpm] of list) {
    seen.add(id);
    let h = hearts.get(id);
    if (!h) {
      const node = document.createElement('div');
      node.className = 'heart';
      const svg = el('svg', { viewBox: '0 0 24 24' });
      el('path', { d: HEART }, svg);
      const label = document.createElement('span');
      node.append(svg, label);
      box.appendChild(node);
      h = { el: node, svg, label, bpm: null, phase: Math.random() };
      hearts.set(id, h);
    }
    h.bpm = bpm;
    h.el.classList.toggle('waiting', bpm === null);
    h.label.textContent = bpm === null ? '…' : Math.round(bpm);
    h.el.setAttribute('aria-label', bpm === null ? 'measuring' : `${Math.round(bpm)} bpm`);
  }
  for (const [id, h] of hearts) {
    if (seen.has(id) || h.leaving) continue;
    h.leaving = true; h.bpm = null;
    h.el.classList.add('gone');
    setTimeout(() => { h.el.remove(); hearts.delete(id); }, 500);
  }
  const n = list.length;
  box.style.setProperty('--size', `${n <= 8 ? 140 : n <= 20 ? 104 : n <= 40 ? 80 : n <= 80 ? 60 : 46}px`);
  $('heartsEmpty').hidden = n > 0;
}

// Fast rise, slower fall, with a smaller second bump: lub-dub.
function beatShape(p) {
  const bump = (c, w, a) => a * Math.exp(-(((p - c) / w) ** 2));
  return bump(0.06, 0.045, 1) + bump(0.24, 0.05, 0.45);
}
let lastFrame = performance.now();
function animateHearts(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  for (const h of hearts.values()) {
    if (h.bpm === null || reduceMotion) { h.svg.style.transform = ''; continue; }
    h.phase = (h.phase + dt * h.bpm / 60) % 1;
    h.svg.style.transform = `scale(${(0.86 + 0.2 * beatShape(h.phase)).toFixed(3)})`;
  }
  requestAnimationFrame(animateHearts);
}
requestAnimationFrame(animateHearts);

// ------------------------------------------------------------ data

let last = null, noticeUntil = 0;     // a reset message stays up a few seconds
function say(text, bad) {
  $('status').textContent = text;
  $('status').classList.toggle('bad', bad);
}
async function poll() {
  try {
    const res = await fetch('/api/class', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    last = await res.json();
    render(last);
    if (Date.now() > noticeUntil) say('Live. Nothing here identifies anyone: one dot per connected camera.', false);
  } catch (e) {
    say('Lost the connection to the server. Retrying…', true);
  }
  setTimeout(poll, 1000);
}

// A stat counts to its new value instead of jumping.
function countTo(id, value) {
  const node = $(id), from = Number(node.textContent);
  if (value === null || !Number.isFinite(from) || reduceMotion) { node.textContent = value === null ? '–' : value; return; }
  if (from === value) return;
  const start = performance.now(), dur = 600;
  cancelAnimationFrame(node._raf);
  const step = (now) => {
    const k = Math.min(1, (now - start) / dur), e = 1 - (1 - k) ** 3;
    node.textContent = Math.round(from + (value - from) * e);
    if (k < 1) node._raf = requestAnimationFrame(step);
  };
  node._raf = requestAnimationFrame(step);
}

function render(d) {
  const r = d.readings;
  countTo('connected', d.connected);
  countTo('reading', r.length);
  countTo('median', d.median === null ? null : Math.round(d.median));
  $('range').textContent = r.length ? `${Math.round(r[0])}–${Math.round(r[r.length - 1])}` : '–';
  drawHearts(d.hearts || []);
  drawChecks(d.checks);
  drawHistogram(r, d.median);
}

$('resetBtn').hidden = !PRESENTER_KEY;
$('resetBtn').onclick = async () => {
  if (!confirm('Clear everyone\'s pulse checks from the class view?')) return;
  try {
    const res = await fetch('/api/class/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                  body: JSON.stringify({ key: PRESENTER_KEY }) });
    say(res.ok ? 'Pulse checks cleared.' : 'The server did not accept that presenter key.', !res.ok);
  } catch (e) {
    say('Could not reach the server.', true);
  }
  noticeUntil = Date.now() + 4000;
};

window.addEventListener('resize', () => last && render(last));
Theme.bind($('theme'));
Theme.onChange(() => last && render(last));
poll();
</script>
</body>
</html>
