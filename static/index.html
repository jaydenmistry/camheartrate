<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera Heart Rate</title>
<script src="/static/theme.js"></script>
<style>
  /* Apple Human Interface Guidelines look: system font, grouped background with
     rounded cards, system colours, capsule buttons, a segmented control, and
     motion that settles like a spring. The camera is the stage; under it one
     line of status, then the heart rate and its graph. */
  :root {
    --ground: #f2f2f7;      /* systemGroupedBackground */
    --card: #ffffff;        /* secondarySystemGroupedBackground */
    --ink: #000000;         /* label */
    --muted: #6c6c70;       /* secondary label, the high-contrast variant */
    --rule: #e5e5ea;        /* separator / systemGray5 */
    --fill: rgb(120 120 128 / 0.12);
    --fill-hover: rgb(120 120 128 / 0.2);
    --thumb: #ffffff;
    --tint: #ff2d55;        /* systemPink: heart, chart marks (3.6:1 on white) */
    --blood: #d70015;       /* red for text: 5.4:1 on white */
    --button: #e8193f;      /* filled buttons: white text at 4.5:1 */
    --stage: #1c1c1e;
    --on-stage: #ffffff;
    --scrim: rgb(28 28 30 / 0.62);
    --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px rgb(0 0 0 / 0.04);
    --flush: 255 45 85;     /* rgb triplet for the beat flush over skin */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
    --spring: cubic-bezier(0.22, 1.2, 0.36, 1);       /* slight overshoot */
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --ground: #000000; --card: #1c1c1e; --ink: #ffffff; --muted: #98989d; --rule: #38383a;
    --fill: rgb(118 118 128 / 0.24); --fill-hover: rgb(118 118 128 / 0.34); --thumb: #636366;
    --tint: #ff375f; --blood: #ff453a; --stage: #000000; --shadow: none;
    color-scheme: dark;
  }
  /* Screen light: the page turns into a steady, neutral white light source for
     the skin. It is always light; choosing dark turns it off. */
  :root[data-light="on"] {
    --ground: #ffffff; --card: #ffffff; --shadow: none;
  }
  :root[data-light="on"] .card { border-color: var(--rule); }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.4;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
  }
  main {
    --ar: 1.7778;
    width: min(100%, 1120px, calc(60vh * var(--ar)));
    margin: 0 auto;
    padding-block: clamp(12px, 2.4vh, 28px);
    display: grid;
    gap: 14px;
  }

  /* ---- entrance: each block rises into place, one after another ---- */
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.985); } }
  main > * { animation: rise 0.7s var(--spring) both; }
  main > *:nth-child(2) { animation-delay: 0.05s; }
  main > *:nth-child(3) { animation-delay: 0.1s; }
  main > *:nth-child(n+4) { animation-delay: 0.15s; }

  /* ---- header ---- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .title h1 { margin: 0; font-size: clamp(24px, 3.2vw, 34px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .title svg { width: 30px; height: 30px; flex-shrink: 0; }
  .title svg path, .beat-heart path { fill: var(--tint); }

  /* Segmented control (Light / Dark). */
  .segmented {
    position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; flex-shrink: 0;
    background: var(--fill); border-radius: 9px; padding: 2px;
  }
  .segmented button {
    position: relative; z-index: 1; font: inherit; font-size: 13px; font-weight: 500; color: var(--ink);
    background: none; border: 0; padding: 5px 16px; border-radius: 7px; cursor: pointer;
  }
  .segmented button:focus-visible { outline: 2px solid var(--tint); outline-offset: 1px; }
  .segmented .thumb {
    position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px);
    background: var(--thumb); border-radius: 7px;
    box-shadow: 0 3px 8px rgb(0 0 0 / 0.12), 0 3px 1px rgb(0 0 0 / 0.04);
    transition: transform 0.4s var(--spring), background-color 0.3s;
  }
  .segmented[data-value="dark"] .thumb { transform: translateX(100%); }

  /* ---- cards ---- */
  .card {
    background: var(--card); border-radius: 20px; padding: 16px 18px; border: 1px solid transparent;
    box-shadow: var(--shadow); transition: background-color 0.3s var(--ease);
  }

  /* ---- camera stage ---- */
  .stage {
    --beat: 0;
    position: relative;
    width: 100%;
    aspect-ratio: var(--ar);
    background: var(--stage);
    border-radius: 22px;
    overflow: hidden;
    cursor: crosshair;
    -webkit-tap-highlight-color: transparent;
    box-shadow: var(--shadow);
  }
  .stage img, .stage video, .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage img, .stage video { object-fit: cover; display: block; }
  .stage video { transform: scaleX(-1); }     /* a selfie view; the outline is mirrored to match */
  .stage svg { pointer-events: none; overflow: visible; }
  /* Pulse magnifier (magnify.js): the video with its colour changes amplified, drawn on top. */
  .stage canvas.mag { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .stage canvas.mag.mirror { transform: scaleX(-1); }
  @keyframes fade-in { from { opacity: 0; } }
  .stage canvas.mag:not([hidden]) { animation: fade-in 0.5s var(--ease); }
  .mag-ctl {
    position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 10px;
    background: var(--scrim); color: var(--on-stage); padding: 7px 14px; border-radius: 999px; font-size: 14px;
    backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8); cursor: default;
    font-variant-numeric: tabular-nums;
  }
  .mag-ctl:not([hidden]) { animation: rise 0.5s var(--spring); }
  .mag-ctl input { width: clamp(90px, 14vw, 160px); accent-color: var(--tint); }
  .roi {
    fill: rgb(var(--flush) / calc(0.04 + var(--beat) * 0.30));
    stroke: var(--on-stage);
    stroke-width: calc(1.5px + var(--beat) * 1.5px);
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    filter: drop-shadow(0 0 1.5px rgb(0 0 0 / 0.55));
  }
  .stage[data-phase="measuring"] .roi { stroke-dasharray: 6 5; animation: march 0.9s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -11; } }
  .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center; gap: 14px; align-content: center;
    color: var(--on-stage); opacity: 0.75; font-size: 15px; text-align: center; padding: 16px;
  }
  /* Activity indicator while the camera and tracking start. */
  .placeholder::before {
    content: ''; width: 26px; height: 26px; border-radius: 50%;
    border: 2.5px solid rgb(255 255 255 / 0.25); border-top-color: var(--on-stage);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(1turn); } }
  .toast {
    position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 12px) scale(0.96);
    max-width: calc(100% - 32px);
    background: var(--scrim); color: var(--on-stage);
    padding: 9px 16px; border-radius: 14px; font-size: 15px; font-weight: 500;
    opacity: 0; transition: opacity 0.2s var(--ease), transform 0.45s var(--spring); pointer-events: none;
    backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  /* Progress to the first reading, along the bottom edge of the camera. */
  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgb(255 255 255 / 0.2); }
  .progress span {
    display: block; height: 100%; width: calc(var(--p, 0) * 100%);
    background: var(--tint); transition: width 0.35s var(--ease);
  }

  /* ---- status line ---- */
  .status {
    display: flex; align-items: center; justify-content: space-between; gap: 10px 16px;
    flex-wrap: wrap; font-size: 15px; min-height: 22px; padding-inline: 4px;
  }
  .status-text { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; align-self: center;
    background: var(--muted); transform: scale(calc(1 + var(--beat, 0) * 0.45));
    transition: background-color 0.3s;
  }
  .status[data-phase="locked"] .dot { background: var(--tint); }
  .status[data-phase="warning"] .status-main { color: var(--blood); }
  .status-main { font-weight: 500; }
  .status-hint { color: var(--muted); }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mode { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding-inline: 4px; }
  .mode:empty { display: none; }
  /* Capsule buttons, tinted grey (HIG "gray" button). */
  .link {
    font: inherit; font-size: 15px; font-weight: 500; color: var(--blood); background: var(--fill);
    border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; text-decoration: none;
    transition: transform 0.35s var(--spring), background-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .link:hover { background: var(--fill-hover); }
  .link:active { transform: scale(0.95); transition-duration: 0.08s; }
  .link:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  .controls > *:not([hidden]) { animation: rise 0.45s var(--spring); }

  /* ---- pulse check ---- */
  .check { display: grid; gap: 12px; }
  .check:not([hidden]) { animation: rise 0.5s var(--spring); }
  .check p { margin: 0; }
  .check-row { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
  .tap {
    font: inherit; font-size: 17px; font-weight: 600; color: #fff; background: var(--button);
    border: 0; border-radius: 14px; padding: 14px 30px; cursor: pointer;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    transition: transform 0.3s var(--spring);
  }
  .tap.hit { transform: scale(0.93); transition-duration: 0.06s; }
  .tap:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  /* While tapping, the camera's number is hidden so it cannot lead the tapping. */
  .readout .bpm, .readout .trend canvas { transition: filter 0.3s var(--ease); }
  .readout[data-blind] .bpm, .readout[data-blind] .trend canvas { filter: blur(18px); }

  /* ---- pulse wave (presenter) ---- */
  .wave { display: grid; gap: 6px; }
  .wave-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; font-weight: 600; }
  .wave-head span:last-child { color: var(--muted); font-size: 13px; font-weight: 400; }
  .wave canvas { width: 100%; height: clamp(72px, 11vh, 120px); display: block; }

  /* ---- readout ---- */
  .readout {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: end;
  }
  .reading { display: grid; justify-items: start; min-width: 4.2ch; gap: 2px; }
  .reading-head { display: flex; align-items: center; gap: 6px; color: var(--tint); font-size: 15px; font-weight: 600; }
  .beat-heart { width: 18px; height: 18px; transform: scale(calc(1 + var(--beat, 0) * 0.28)); }
  .bpm-row { display: flex; align-items: baseline; gap: 6px; }
  .bpm {
    font-family: var(--font-num);
    font-size: clamp(76px, 10vw, 128px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 0.95;
    transition: color 0.3s;
    display: inline-block;
  }
  .bpm[data-quality="poor"], .bpm[data-quality="none"] { color: var(--muted); }
  .unit { color: var(--muted); font-size: 20px; font-weight: 600; }
  .signal { display: flex; align-items: flex-end; gap: 7px; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
  .bars i { width: 4px; border-radius: 1px; background: var(--rule); transition: background-color 0.3s; }
  .bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 7px; }
  .bars i:nth-child(3) { height: 10px; } .bars i:nth-child(4) { height: 12px; }
  .bars i.on { background: var(--ink); }
  .trend { display: grid; gap: 4px; min-width: 0; }
  .trend canvas { width: 100%; height: clamp(120px, 17vh, 170px); display: block; }
  .trend-axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; padding-right: 34px; }
  .trend-note { font-size: 15px; font-variant-numeric: tabular-nums; }
  .trend-note:not([hidden]) { animation: rise 0.5s var(--spring); }
  .trend-note b { font-weight: 650; }

  /* Theme change: the page cross-fades (View Transitions, where supported). */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.35s; }

  @media (max-width: 640px) {
    .readout { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .stage { border-radius: 16px; }
    .card { border-radius: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C12 21 3 14.6 3 8.6A4.6 4.6 0 0 1 12 6.4A4.6 4.6 0 0 1 21 8.6C21 14.6 12 21 12 21Z"/></svg>
      <h1>Camera Heart Rate</h1>
    </div>
    <div class="segmented" id="theme" data-theme-switch role="radiogroup" aria-label="Appearance">
      <span class="thumb" aria-hidden="true"></span>
      <button role="radio" data-choice="light">Light</button>
      <button role="radio" data-choice="dark">Dark</button>
    </div>
  </header>

  <div class="stage" id="stage" data-phase="none">
    <img id="video" alt="Live camera view. Tap any skin to measure there.">
    <video id="cam" playsinline muted hidden aria-label="Live camera view. Tap your face or palm to measure there."></video>
    <canvas class="mag" id="mag" hidden aria-label="The camera view with the pulse's colour change magnified"></canvas>
    <svg viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"><path id="roi" class="roi" d=""/></svg>
    <div class="placeholder" id="placeholder">Starting the camera…</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="progress" id="progress" hidden><span></span></div>
    <div class="mag-ctl" id="magCtl" hidden>
      <label for="magRange" id="magLabel">Colour change ×60</label>
      <input type="range" id="magRange" min="0" max="150" step="10" value="60">
    </div>
  </div>

  <div class="status" id="status" data-phase="none">
    <div class="status-text">
      <span class="dot" id="dot"></span>
      <span class="status-main" id="statusMain">Connecting…</span>
      <span class="status-hint" id="statusHint"></span>
    </div>
    <div class="controls">
      <a class="link" id="classLink" target="_blank" rel="noopener" hidden>Class view</a>
      <button class="link" id="checkBtn" hidden>Check with your pulse</button>
      <button class="link" id="magBtn" hidden>Magnify the pulse</button>
      <button class="link" id="autoBtn" hidden>Pick skin automatically</button>
      <span class="mode" id="mode"></span>
      <button class="link" id="camBtn" hidden></button>
      <button class="link" id="lightBtn">Turn screen light off</button>
      <button class="link" id="fullBtn" hidden>Full screen</button>
    </div>
  </div>

  <section class="check card" id="check" hidden aria-live="polite">
    <p id="checkText"></p>
    <div class="check-row">
      <button class="tap" id="tapBtn">Tap on each beat</button>
      <button class="link" id="checkClose">Cancel</button>
    </div>
  </section>

  <section class="readout card" aria-label="Heart rate">
    <div class="reading">
      <div class="reading-head">
        <svg class="beat-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C12 21 3 14.6 3 8.6A4.6 4.6 0 0 1 12 6.4A4.6 4.6 0 0 1 21 8.6C21 14.6 12 21 12 21Z"/></svg>
        <span>Heart rate</span>
      </div>
      <div class="bpm-row"><output class="bpm" id="bpm" data-quality="none" aria-live="off">–</output><span class="unit" title="beats per minute">BPM</span></div>
      <span class="signal" id="signal" hidden><span class="bars" id="bars"><i></i><i></i><i></i><i></i></span><span id="signalText">signal</span></span>
    </div>
    <div class="trend">
      <canvas id="trend" aria-label="Heart rate over the last minute"></canvas>
      <div class="trend-axis"><span id="trendStart">1 min ago</span><span>now</span></div>
      <div class="trend-note" id="trendNote" hidden></div>
    </div>
  </section>

  <section class="wave card" id="wave" hidden aria-label="Pulse wave">
    <div class="wave-head"><span>Pulse wave, last 6 seconds</span><span>each dot is a heartbeat</span></div>
    <canvas id="waveCanvas"></canvas>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const stage = $('stage'), video = $('video'), roi = $('roi'), statusEl = $('status');
const LABEL = { face: 'your face', palm: 'your palm', skin: 'the outlined skin', simulated: 'the simulated face' };
const METHOD = { POS: 'POS', CHROM: 'CHROM', GREEN: 'raw green channel' };
const HISTORY_S = 300, SAMPLE_MS = 500;   // kept; the graph shows the last 1 or 5 minutes (presenter: T)
const MIN_SKIN_AREA = 0.004;    // skin smaller than this share of the picture: too far away
const MIN_BRIGHTNESS = 40;      // mean skin luma (0-255) below this: too little light
// A deployed page only offers the demo keys to the presenter: open it with ?presenter=<RPPG_PRESENTER_KEY>.
const PRESENTER_KEY = new URLSearchParams(location.search).get('presenter') || '';
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const st = { tele: null, dirty: false, ar: null, noticeId: null, hr: null, phase: 0, history: [], lastSample: 0,
             window: 60, marks: [] };

// "server": show this machine's camera, measured by the server (local demo).
// "browser": measure this browser's own camera (deployed); see static/browser.js.
let mode = 'server', browserCam = null;

// What the page shows: the server's telemetry, with the browser's own camera,
// skin region and messages laid over it while that camera is the source.
function current() {
  const t = st.tele || { status: null, bpm: null };
  if (!browserCam || t.source === 'synthetic') return t;
  const local = browserCam.telemetry();
  if (st.connected === false && !local.message) local.message = 'Lost the connection to the server. Retrying…';
  return { ...t, ...local };
}

// Screen light: on unless the viewer turned it off last time.
let light = true;
try { light = localStorage.getItem('screenLight') !== 'off'; } catch (e) { /* storage blocked */ }
if (Theme.get() === 'dark') light = false;        // the screen light is a white page
function setLight(on, announce) {
  light = on;
  if (on && Theme.get() === 'dark') Theme.set('light');
  document.documentElement.dataset.light = on ? 'on' : 'off';
  $('lightBtn').textContent = on ? 'Turn screen light off' : 'Turn screen light on';
  try { localStorage.setItem('screenLight', on ? 'on' : 'off'); } catch (e) { /* ignore */ }
  if (announce) toast(on ? 'Screen light on. Turn your display brightness all the way up.' : 'Screen light off');
  if (announce && browserCam) browserCam.settle();      // the light on the skin changed
  drawTrend();
}

// ------------------------------------------------------------- connection
let ws = null;
function connect() {
  const query = PRESENTER_KEY ? `?presenter=${encodeURIComponent(PRESENTER_KEY)}` : '';
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws${query}`);
  ws.binaryType = 'blob';
  ws.onopen = () => { st.connected = true; };
  ws.onclose = () => { st.connected = false; st.dirty = true; setStatus('warning', 'Lost the connection to the server. Retrying…', ''); setTimeout(connect, 1000); };
  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') { st.tele = JSON.parse(ev.data); st.dirty = true; return; }
    const url = URL.createObjectURL(ev.data);
    const prev = video.src;
    video.src = url;
    if (prev.startsWith('blob:')) URL.revokeObjectURL(prev);
    $('placeholder').hidden = true;
  };
}
const send = (msg) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); };

// ------------------------------------------------------------- input
stage.addEventListener('click', (e) => {
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (browserCam) browserCam.tap(1 - x, y);           // the view is mirrored
  else send({ type: 'select', x, y });
});
$('autoBtn').onclick = () => browserCam ? browserCam.release() : send({ type: 'auto' });
$('lightBtn').onclick = () => setLight(!light, true);
// A bigger white area is a brighter light: offer full screen where the browser allows it.
if (document.documentElement.requestFullscreen) {
  $('fullBtn').hidden = false;
  $('fullBtn').onclick = () => document.fullscreenElement
    ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  document.addEventListener('fullscreenchange', () => {
    $('fullBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
  });
}
$('camBtn').onclick = () => {
  const next = $('camBtn').dataset.id;
  if (!next) return;
  if (browserCam) browserCam.switchTo(next); else send({ type: 'camera', value: next });
  toast(`Switching to ${$('camBtn').dataset.name}`);
};

// ------------------------------------------------------------- pulse magnifier
// Amplifies the colour change in the video itself, so the skin visibly flushes
// on each beat (magnify.js). Runs in this browser only; nothing extra is sent.
const mag = { on: false, tool: null, strength: 60 };
async function setMagnify(on) {
  if (on && !mag.tool) {
    const { Magnifier } = await import('/static/magnify.js');
    mag.tool = new Magnifier($('mag'));
    mag.tool.setStrength(mag.strength);
  }
  mag.on = on;
  $('magBtn').textContent = on ? 'Stop magnifying' : 'Magnify the pulse';
  $('magCtl').hidden = !on;
  if (on) toast('Hold very still: movement is magnified too.');
  st.dirty = true;
  if (mag.tool) { magSource(); mag.tool.setOn(on); }
}
function setMagStrength(s) {
  mag.strength = Math.max(0, Math.min(150, s));
  $('magRange').value = mag.strength;
  $('magLabel').textContent = mag.strength ? `Colour change ×${mag.strength}` : 'Colour change ×0, as the camera sees it';
  if (mag.tool) mag.tool.setStrength(mag.strength);
}
// Magnify whatever is on screen: this browser's camera (mirrored), or frames from the server.
function magSource() {
  if (!mag.tool) return;
  const cam = browserCam && !$('cam').hidden;
  mag.tool.setSource(cam ? $('cam') : video);
  $('mag').classList.toggle('mirror', cam);
}
$('magBtn').onclick = () => setMagnify(!mag.on);
$('magRange').oninput = () => setMagStrength(Number($('magRange').value));
$('magCtl').addEventListener('click', (e) => e.stopPropagation());     // not a tap on the skin

// ------------------------------------------------------------- marks
// For a live experiment (exercise, then rest; a breath-hold): N drops a
// numbered mark on the graph, and the line under it compares the heart rate
// then with now. T switches the graph between the last 1 and 5 minutes.
function setWindow(s) {
  st.window = s;
  $('trendStart').textContent = s === 60 ? '1 min ago' : `${s / 60} min ago`;
  $('trend').setAttribute('aria-label', `Heart rate over the last ${s === 60 ? 'minute' : `${s / 60} minutes`}`);
  drawTrend();
}
function addMark() {
  const now = performance.now();
  st.marks.push({ t: now, n: st.marks.length + 1 });
  if (st.window === 60) setWindow(300);
  toast(`Mark ${st.marks.length}`);
  drawTrend();
}
// The reading nearest a moment, within 3 s.
function bpmAt(ts) {
  let best = null;
  for (const p of st.history) {
    if (p.bpm !== null && Math.abs(p.t - ts) <= 3000 && (!best || Math.abs(p.t - ts) < Math.abs(best.t - ts))) best = p;
  }
  return best ? best.bpm : null;
}
const clock = (ms) => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const signed = (v) => `${v > 0 ? '+' : v < 0 ? '−' : '±'}${Math.abs(Math.round(v))}`;
function markNote() {
  const note = $('trendNote'), m = st.marks[st.marks.length - 1];
  note.hidden = !m;
  if (!m) return;
  const now = performance.now(), then = bpmAt(m.t), cur = st.hr;
  const since = st.history.filter(p => p.t >= m.t && p.bpm !== null).map(p => p.bpm);
  const parts = [`Since mark ${m.n} (${clock(now - m.t)} ago):`];
  if (then === null) parts.push('no reading at the mark.');
  else {
    parts.push(cur === null ? `<b>${Math.round(then)}</b> bpm then, no reading now.`
      : `<b>${Math.round(then)} → ${Math.round(cur)}</b> bpm, ${signed(cur - then)} (${signed((cur - then) / then * 100)}%).`);
    if (since.length) parts.push(`Lowest ${Math.round(Math.min(...since))}, highest ${Math.round(Math.max(...since))}.`);
    const later = now - m.t >= 60000 ? bpmAt(m.t + 60000) : null;
    if (later !== null) parts.push(`One minute after: ${Math.round(later)} (${signed(later - then)}).`);
  }
  note.innerHTML = parts.join(' ');
}

// Demo controls stay off screen: 1/2/3 method, S simulation, arrows tune the simulation,
// M magnifier, [ and ] its strength, N mark, X clear marks, T 1 or 5 minutes.
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (chk.on && !chk.done && e.key === ' ') { e.preventDefault(); if (!e.repeat) tapBeat(); return; }
  if (!st.tele) return;
  const t = st.tele, sim = t.synthetic;
  if (mode === 'browser' && !t.presenter) return;
  if (e.target instanceof HTMLInputElement) return;
  const methods = { '1': 'POS', '2': 'CHROM', '3': 'GREEN' };
  if (e.key === 'm' || e.key === 'M') {
    setMagnify(!mag.on);
  } else if (e.key === 'n' || e.key === 'N') {
    addMark();
  } else if ((e.key === 'x' || e.key === 'X') && st.marks.length) {
    st.marks = []; toast('Marks cleared'); drawTrend();
  } else if (e.key === 't' || e.key === 'T') {
    setWindow(st.window === 60 ? 300 : 60);
  } else if (mag.on && (e.key === '[' || e.key === ']')) {
    setMagStrength(mag.strength + (e.key === ']' ? 10 : -10));
  } else if (methods[e.key]) {
    send({ type: 'algorithm', value: methods[e.key] });
    toast(`Method: ${METHOD[methods[e.key]]}`);
  } else if (e.key === 's' || e.key === 'S') {
    const to = t.source === 'synthetic' ? 'camera' : 'synthetic';
    send({ type: 'source', value: to });
    if (browserCam) browserCam.setActive(to === 'camera');
    toast(to === 'synthetic' ? 'Simulation on' : 'Camera on');
  } else if (sim && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const bpm = Math.max(60, Math.min(160, sim.bpm + (e.key === 'ArrowUp' ? 5 : -5)));
    send({ type: 'synthetic', bpm }); toast(`Simulated heart rate ${bpm} bpm`); e.preventDefault();
  } else if (sim && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const motion = Math.max(0, Math.min(1, Math.round((sim.motion + (e.key === 'ArrowRight' ? 0.1 : -0.1)) * 10) / 10));
    send({ type: 'synthetic', motion }); toast(`Simulated movement ${Math.round(motion * 100)}%`); e.preventDefault();
  }
});

let toastTimer = 0;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ------------------------------------------------------------- pulse check
// Tap along with a finger on your wrist or neck and compare with the camera.
const CHECK_S = 15;
const chk = { on: false, done: false, taps: [], camera: [], timer: 0 };
const readoutEl = document.querySelector('.readout');
const round = Math.round;

function startCheck() {
  clearTimeout(chk.timer);
  Object.assign(chk, { on: true, done: false, taps: [], camera: [] });
  $('check').hidden = false;
  $('tapBtn').hidden = false;
  $('checkClose').textContent = 'Cancel';
  $('checkText').textContent = 'Find your pulse on your wrist or neck. Tap the button, or press the space bar, '
    + `on every beat for ${CHECK_S} seconds.`;
  readoutEl.dataset.blind = '';
  $('tapBtn').focus();
}

function closeCheck() {
  clearTimeout(chk.timer);
  chk.on = false;
  $('check').hidden = true;
  delete readoutEl.dataset.blind;
}

function tapBeat() {
  if (!chk.on || chk.done) return;
  const now = performance.now();
  chk.taps.push(now);
  if (chk.taps.length === 1) chk.timer = setTimeout(finishCheck, CHECK_S * 1000);
  const rate = tappedRate(chk.taps), n = chk.taps.length;
  const left = Math.max(1, Math.ceil(CHECK_S - (now - chk.taps[0]) / 1000));
  $('checkText').textContent = `${n} beat${n === 1 ? '' : 's'}${rate ? `, about ${round(rate)} bpm` : ''}. `
    + `Keep going for ${left} more second${left === 1 ? '' : 's'}.`;
  $('tapBtn').classList.add('hit');
  setTimeout(() => $('tapBtn').classList.remove('hit'), 90);
}

// Rate from the median gap between taps; gaps that look like a doubled or
// missed tap (faster than 220 or slower than 30 bpm) are dropped.
function tappedRate(taps) {
  const gaps = [];
  for (let i = 1; i < taps.length; i++) {
    const g = (taps[i] - taps[i - 1]) / 1000;
    if (g >= 0.27 && g <= 2.0) gaps.push(g);
  }
  return gaps.length < 5 ? null : 60 / median(gaps);
}

function median(xs) {
  const v = xs.slice().sort((a, b) => a - b), m = v.length >> 1;
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

function finishCheck() {
  chk.done = true;
  $('tapBtn').hidden = true;
  $('checkClose').textContent = 'Close';
  delete readoutEl.dataset.blind;
  const tapped = tappedRate(chk.taps);
  const camera = chk.camera.length ? median(chk.camera) : null;
  let text;
  if (!tapped) {
    text = 'Not enough steady taps to work out your pulse. Try again, tapping on every beat.';
  } else if (camera === null) {
    text = `You tapped ${round(tapped)} bpm. The camera had no steady reading meanwhile, so hold still and try again.`;
  } else {
    const gap = Math.abs(tapped - camera);
    text = `You tapped ${round(tapped)} bpm and the camera read ${round(camera)} bpm: `
      + (gap <= 5 ? 'a good match.' : gap <= 10 ? `${round(gap)} bpm apart, close.`
         : `${round(gap)} bpm apart. Hold still, add light and try again.`);
    if (mode === 'browser') send({ type: 'check', tapped, camera });
  }
  $('checkText').textContent = text;
}

$('checkBtn').onclick = startCheck;
$('checkClose').onclick = closeCheck;
// pointerdown, not click: it fires the instant a finger lands, and the space bar is handled above.
$('tapBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); tapBeat(); });

// ------------------------------------------------------------- status
function setStatus(phase, main, hint) {
  statusEl.dataset.phase = phase;
  $('statusMain').textContent = main;
  $('statusHint').textContent = hint;
}

// The one thing most worth fixing right now, judged from what the camera sees.
function problem(t) {
  if (t.source !== 'camera' || !t.region) return '';
  if (t.moving) return 'Hold still and stay quiet.';
  if (t.roi_pixels && t.frame && t.roi_pixels / (t.frame[0] * t.frame[1]) < MIN_SKIN_AREA) {
    return 'Move closer to the camera.';
  }
  if (t.brightness != null && t.brightness < MIN_BRIGHTNESS) {
    return light ? 'Not enough light. Turn your screen brightness all the way up.'
                 : 'Not enough light. Turn the screen light on, or face a lamp.';
  }
  if (t.clipped > 0.25) return 'Too much light on your skin. Move back from the light a little.';
  return '';
}

function describe(t) {
  const label = LABEL[t.region?.kind] || 'your skin';
  if (t.message) return ['warning', t.message, ''];
  if (t.source === 'idle') return ['none', t.loading || 'Starting the camera…', ''];
  const issue = problem(t);
  const hint = t.source !== 'camera' || t.region?.locked ? ''
    : mode === 'browser' ? 'Tap your face or palm to measure there.' : 'Tap any skin to measure there.';
  const truth = t.synthetic ? ` True rate ${Math.round(t.synthetic.bpm_actual ?? t.synthetic.bpm)} bpm.` : '';
  switch (t.status) {
    case 'NO SKIN': return ['none', mode === 'browser' ? 'Show your face or palm to the camera.'
                                                     : 'Show your face, palm or arm to the camera.', ''];
    case 'CALIBRATING': {
      if (issue) return ['warning', issue, ''];
      const left = Math.max(1, Math.ceil((t.min_buffer_s || 5) - (t.buffer_s || 0)));
      return ['measuring', `Measuring ${label}. Hold still for ${left} more second${left === 1 ? '' : 's'}.`, ''];
    }
    case 'LOCKED': return ['locked', `Reading ${label}.${truth}`, issue || hint];
    case 'WEAK SIGNAL': return issue ? ['warning', issue, '']
      : ['locked', `Weak signal from ${label}. More light will help.${truth}`, hint];
    case 'HIGH MOTION NOISE': return issue ? ['warning', issue, hint]
      : ['warning', t.bpm === null ? 'Almost there. Keep still.'
                                   : `Weak signal from ${label}. Add light or move a little closer.`, hint];
    default: return ['none', 'Connecting…', ''];
  }
}

// How far along the first reading is: the buffer filling (to 70 %), then the
// signal quality rising towards a lock. Null once there is a reading.
function progressOf(t) {
  if (t.message || t.source === 'idle' || !t.region || t.bpm !== null || !t.status || t.status === 'NO SKIN') return null;
  const fill = Math.min(1, (t.buffer_s || 0) / (t.min_buffer_s || 5));
  return t.status === 'CALIBRATING' ? 0.7 * fill : 0.7 + 0.3 * Math.min(1, (t.sqi || 0) / 50);
}

// ------------------------------------------------------------- render
function render(t) {
  if (t.frame) {
    const ar = t.frame[0] / t.frame[1];
    if (ar !== st.ar) { document.querySelector('main').style.setProperty('--ar', ar.toFixed(4)); st.ar = ar; }
  }
  if (browserCam) {
    const sim = t.source === 'synthetic';
    $('cam').hidden = sim;
    video.hidden = !sim;
    $('placeholder').hidden = sim ? !!video.src : browserCam.state === 'camera';
  }
  const outline = t.region?.outline || [];
  roi.setAttribute('d', outline.map(poly => 'M' + poly.map(p => `${p[0]} ${p[1]}`).join('L') + 'Z').join(''));

  const [phase, main, hint] = describe(t);
  setStatus(phase, main, hint);
  stage.dataset.phase = phase;
  $('autoBtn').hidden = !(t.region && t.region.locked);
  $('checkBtn').hidden = !(t.source === 'camera' && t.region) || (chk.on && !chk.done);
  $('magBtn').hidden = !(t.source === 'camera' || t.source === 'synthetic');
  if (mag.on) magSource();

  const cam = t.camera, cams = t.cameras || [];
  $('mode').textContent = cam ? `${cam.height}p at ${Math.round(cam.fps)} fps${cam.held ? ', exposure held' : ''}` : '';
  const other = cam && cams.find(c => c.id !== cam.id);
  $('camBtn').hidden = !other;
  if (other) {
    $('camBtn').dataset.id = other.id;
    $('camBtn').dataset.name = other.name;
    $('camBtn').textContent = `Use ${other.name}${other.fps > cam.fps ? ` (${Math.round(other.fps)} fps)` : ''}`;
  }

  if (t.bvp && t.bvp.t && t.bvp.t.length) st.wave = { ...t.bvp, at: performance.now() };
  $('wave').hidden = !(mode === 'server' || t.presenter);
  $('classLink').hidden = !(mode === 'browser' && t.presenter);
  if (!$('classLink').hidden) $('classLink').href = `/class?presenter=${encodeURIComponent(PRESENTER_KEY)}`;

  const p = progressOf(t);
  $('progress').hidden = p === null;
  if (p !== null) $('progress').style.setProperty('--p', p.toFixed(3));

  // Signal quality, once there is enough data to judge it.
  const judged = t.region && t.status && !['CALIBRATING', 'NO SKIN'].includes(t.status) && !t.message;
  $('signal').hidden = !judged;
  if (judged) {
    const sqi = t.sqi || 0, level = sqi < 30 ? 0 : sqi < 40 ? 1 : sqi < 50 ? 2 : sqi < 70 ? 3 : 4;
    [...$('bars').children].forEach((bar, i) => bar.classList.toggle('on', i < level));
    $('signalText').textContent = ['no signal', 'weak signal', 'fair signal', 'good signal', 'strong signal'][level];
  }

  const live = t.bpm !== null && ['LOCKED', 'WEAK SIGNAL', 'HIGH MOTION NOISE'].includes(t.status);
  const bpmEl = $('bpm');
  const shownBpm = live ? String(Math.round(t.bpm)) : '–';
  if (bpmEl.textContent !== shownBpm) {
    bpmEl.textContent = shownBpm;
    // The new number settles in from below, like a numeric text transition.
    if (!reduceMotion && bpmEl.animate) bpmEl.animate(
      [{ transform: 'translateY(0.12em)', opacity: 0.35, filter: 'blur(3px)' }, { transform: 'none', opacity: 1, filter: 'none' }],
      { duration: 320, easing: 'cubic-bezier(0.22, 1.2, 0.36, 1)' });
  }
  bpmEl.dataset.quality = !live ? 'none' : t.status === 'HIGH MOTION NOISE' ? 'poor' : 'good';
  st.hr = live && t.status !== 'HIGH MOTION NOISE' ? t.bpm : null;
  if (chk.on && !chk.done && chk.taps.length && st.hr) chk.camera.push(st.hr);

  if (t.notice) {
    if (st.noticeId !== null && t.notice.id !== st.noticeId && t.notice.text) toast(t.notice.text);
    st.noticeId = t.notice.id;
  }

  const now = performance.now();
  if (now - st.lastSample >= SAMPLE_MS) {
    st.lastSample = now;
    const good = live && t.status !== 'HIGH MOTION NOISE';
    st.history.push({ t: now, bpm: good ? t.bpm : null });
    while (st.history.length && now - st.history[0].t > HISTORY_S * 1000 + SAMPLE_MS) st.history.shift();
    drawTrend();
  }
}

// ------------------------------------------------------------- trend chart
const canvas = $('trend');
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function drawTrend() {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const ink = cssVar('--ink'), muted = cssVar('--muted'), rule = cssVar('--rule'), blood = cssVar('--tint'), ground = cssVar('--card');
  const font = cssVar('--font');
  const padR = 34, padT = 8, padB = 6;
  const plotW = W - padR, plotH = H - padT - padB;

  const now = performance.now(), span = st.window * 1000;
  const shown = st.history.filter(p => now - p.t <= span + SAMPLE_MS);
  const pts = shown.filter(p => p.bpm !== null);
  markNote();
  let lo = 60, hi = 100;
  if (pts.length) {
    const vals = pts.map(p => p.bpm);
    lo = Math.floor((Math.min(...vals) - 4) / 10) * 10;
    hi = Math.ceil((Math.max(...vals) + 4) / 10) * 10;
    if (hi - lo < 20) { const mid = (hi + lo) / 2; lo = Math.floor((mid - 10) / 10) * 10; hi = lo + 20; }
  }
  const step = hi - lo > 60 ? 20 : 10;
  const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * plotH;
  const x = (ts) => plotW * (1 - (now - ts) / span);

  ctx.font = `400 12px ${font}`;
  ctx.textBaseline = 'middle';
  for (let v = lo; v <= hi; v += step) {
    ctx.strokeStyle = rule; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, Math.round(y(v)) + 0.5); ctx.lineTo(plotW, Math.round(y(v)) + 0.5); ctx.stroke();
    ctx.fillStyle = muted; ctx.fillText(String(v), plotW + 8, y(v));
  }

  // Marks: a dashed line and the mark's number.
  for (const m of st.marks) {
    if (now - m.t > span) continue;
    const mx = Math.round(x(m.t)) + 0.5;
    ctx.save();
    ctx.strokeStyle = muted; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(mx, padT + 14); ctx.lineTo(mx, padT + plotH); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = ink; ctx.font = `600 12px ${font}`; ctx.textAlign = 'center';
    ctx.fillText(String(m.n), mx, padT + 6);
    ctx.textAlign = 'start'; ctx.font = `400 12px ${font}`;
  }

  if (!pts.length) {
    ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.font = `400 14px ${font}`;
    ctx.fillText(`Your heart rate over the last ${st.window === 60 ? 'minute' : `${st.window / 60} minutes`} will draw here.`,
                 plotW / 2, padT + plotH / 2);
    ctx.textAlign = 'start';
    return;
  }

  // Split into runs so gaps (no reading) stay visible as breaks in the line.
  const runs = [];
  let run = [];
  for (const p of shown) {
    if (p.bpm === null) { if (run.length) runs.push(run); run = []; } else run.push(p);
  }
  if (run.length) runs.push(run);

  for (const r of runs) {
    const grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
    grad.addColorStop(0, hexA(blood, 0.16)); grad.addColorStop(1, hexA(blood, 0));
    ctx.beginPath();
    r.forEach((p, i) => i ? ctx.lineTo(x(p.t), y(p.bpm)) : ctx.moveTo(x(p.t), y(p.bpm)));
    ctx.lineTo(x(r[r.length - 1].t), padT + plotH); ctx.lineTo(x(r[0].t), padT + plotH); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath();
    r.forEach((p, i) => i ? ctx.lineTo(x(p.t), y(p.bpm)) : ctx.moveTo(x(p.t), y(p.bpm)));
    ctx.strokeStyle = blood; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  }
  const last = st.history[st.history.length - 1];
  if (last.bpm !== null) {
    ctx.beginPath(); ctx.arc(x(last.t), y(last.bpm), 4.5, 0, Math.PI * 2);
    ctx.fillStyle = blood; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = ground; ctx.stroke();
  }
}

function hexA(color, a) {
  const m = color.match(/^#([0-9a-f]{6})$/i);
  if (!m) return color;
  const n = parseInt(m[1], 16);
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

window.addEventListener('resize', drawTrend);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawTrend);

// ------------------------------------------------------------- pulse wave
// The extracted pulse (after the colour projection and filtering), as it
// arrives about 4 times a second. It scrolls left between arrivals so it
// moves smoothly; dots mark the beats the peak finder picked.
const WAVE_S = 6;
function drawWave() {
  const cv = $('waveCanvas'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = cssVar('--rule'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, Math.round(H / 2) + 0.5); ctx.lineTo(W, Math.round(H / 2) + 0.5); ctx.stroke();
  const w = st.wave, age = w ? (performance.now() - w.at) / 1000 : Infinity;
  if (age > 1.5) {
    ctx.fillStyle = cssVar('--muted'); ctx.font = `400 13px ${cssVar('--font')}`; ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('The pulse wave draws here once there is a signal.', W / 2, H / 2 - 12);
    ctx.textAlign = 'start';
    return;
  }
  const x = (tr) => W * (1 + (tr - age) / WAVE_S);
  const y = (v) => H / 2 - Math.max(-3, Math.min(3, v)) / 3 * (H / 2 - 6);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.beginPath();
  w.t.forEach((tr, i) => i ? ctx.lineTo(x(tr), y(w.y[i])) : ctx.moveTo(x(tr), y(w.y[i])));
  ctx.strokeStyle = cssVar('--tint'); ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  for (const i of w.peaks || []) {
    ctx.beginPath(); ctx.arc(x(w.t[i]), y(w.y[i]), 4, 0, Math.PI * 2);
    ctx.fillStyle = cssVar('--tint'); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = cssVar('--card'); ctx.stroke();
  }
  ctx.restore();
}

// ------------------------------------------------------------- frame loop
let lastTs = performance.now();
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
  if (st.dirty) { render(current()); st.dirty = false; }
  let beat = 0;
  // No drawn flush while magnifying: then every colour change on screen is the camera's.
  if (st.hr && !reduceMotion && !light && !chk.on && !mag.on) {
    st.phase = (st.phase + dt * st.hr / 60) % 1;
    beat = st.phase < 0.12 ? st.phase / 0.12 : Math.exp(-(st.phase - 0.12) * 7);   // fast rise, slow fall
  }
  stage.style.setProperty('--beat', beat.toFixed(3));
  if (!$('wave').hidden) drawWave();
  statusEl.style.setProperty('--beat', beat.toFixed(3));
  readoutEl.style.setProperty('--beat', beat.toFixed(3));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setLight(light, false);
// Appearance: light by default (theme.js). Dark is a dark page, so it turns the screen light off.
Theme.bind($('theme'));
Theme.onChange((theme) => {
  if (theme === 'dark' && light) { setLight(false, false); toast('Dark mode. The screen light is off; turn it on for more light on your skin.'); }
  drawTrend();
});

async function boot() {
  let config = {};
  try { config = await (await fetch('/api/config')).json(); } catch (e) { /* older server */ }
  mode = config.mode || mode;
  if (mode === 'browser') {
    const { BrowserCamera } = await import('/static/browser.js');
    browserCam = new BrowserCamera($('cam'), { send, onChange: () => { st.dirty = true; }, onNotice: toast,
                                               localAssets: !!config.local_assets });
    browserCam.start();
  }
  connect();
}
boot();
</script>
</body>
